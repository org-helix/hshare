[package]
name = "hshare"
version = "6.0.0"
edition = "2024"
description = "Share your screen between computers on the same network"
license = "MIT"
repository = "https://github.com/org-helix/hshare"

[dependencies]
ashpd = { version = "0.14.3", optional = true, default-features = false, features = ["tokio", "screencast"] }
eframe = { version = "0.37", features = ["persistence"] }
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
pipewire = { version = "0.10.1", optional = true }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt"], optional = true }
x11rb = "0.14.0"

[features]
default = ["portal"]
# Wayland capture through the screen-cast portal and PipeWire (needs libpipewire-0.3-dev to build).
portal = ["dep:ashpd", "dep:pipewire", "dep:tokio"]

[profile.release]
lto = "thin"
strip = true
