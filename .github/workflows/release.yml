name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release
      - run: |
          cp target/release/hshare hshare-x86_64-linux
          tar czf hshare-${GITHUB_REF_NAME}-x86_64-linux.tar.gz hshare-x86_64-linux README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hshare-x86_64-linux
            hshare-*-x86_64-linux.tar.gz
